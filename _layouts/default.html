<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} :: {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}<span class="cursor">_</span></a>
      <p class="site-tagline">{{ site.tagline }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">[articoli]</a>
        <a href="{{ '/about/' | relative_url }}">[chi sono]</a>
        <a href="{{ '/newsletter/' | relative_url }}">[newsletter]</a>
        <a href="{{ '/feed.xml' | relative_url }}">[rss]</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>-- {{ site.time | date: '%Y' }} {{ site.title }} --</p>
    </footer>
  </div>
</body>
</html>
